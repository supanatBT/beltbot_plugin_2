# brands/modutech/brand.yaml — หนึ่งแบรนด์ = หนึ่งโฟลเดอร์ = หนึ่งไฟล์ตั้งค่า
protocol: 1
key: modutech
enabled: true

info:
  name: Modutech
  order: 2
  kind_th: สายพานโมดูลาร์
  menu_line_th: "สายพานโมดูลาร์ Modutech — งานอาหาร เช่น เนื้อสัตว์ สัตว์ปีก อาหารทะเล เบเกอรี่ ผักผลไม้"
  offtopic_th: สายพานโมดูลาร์ Modutech
  category_th: สายพาน
  answer_patterns: ['modutech', 'โมดูเทค', 'โมดูลาร์', 'modular', 'สายพานโมดูล']

# สถานะข้ามเทิร์น — ส่งออกเป็น modutech_<ช่อง> (ชื่อเดิมที่เบราว์เซอร์เก็บไว้)
state:
  codes: []           # รหัสสายพานที่อยู่ในความสนใจ
  slots: {}           # wet_or_dry · material · line_shape · operating_temp_c
  sprocket_codes: []  # รหัสสเตอร์ของเทิร์นนี้ ไม่สะสมข้ามเทิร์น

data:
  catalogue: ../../modutech_v30_3.json  # 11 ต.ค. ค่ำ: v30_3 = v30_2 + ฝ่ายเทคนิค→พนักงานฝ่ายขาย (CHANGELOG_v30_3.md) · v30_2 = v30_1 + wet_note_th ใหม่ (CHANGELOG_v30_2.md) · 7 ต.ค.: ใช้ v30_1 (คำสั่งโปรเจกต์ที่เขียน v30.json ล้าสมัย)
  graph_db: ../../modutech_kg.db
  qdrant_path: ../../qdrant_modutech_db
  text_collection: modutech_belt_chunks

image:
  enabled: auto                         # ยังไม่มีรูปจริงสักใบ → auto ปิดเอง ทำงานเหมือนเดิมทุกอย่าง
  vit:
    base: google/vit-base-patch16-224-in21k
    adapter: null
    revision: null
  labels: null
  thresholds: null
  collection: modutech_images           # ที่เก็บ (Qdrant Cloud หรือ HF dataset) ยังไม่ตัดสิน — HANDOFF ข้อ 10

# ประตูรูป (claude/PLAN_image_brand_ask.md) — ไม่บอกรุ่น · คัดรูปที่ไม่ใช่สินค้าทิ้ง + บอกว่าไป Modutech ได้เลยไหม
# ไฟล์สร้างด้วย 21_image_eval/06_export_gate.py · ไม่มีไฟล์ = ปิดเอง (รูปไม่ระบุแบรนด์ → ถามแบรนด์)
image_gate:
  enabled: auto
  file: image_gate.npz
  model: google/siglip-base-patch16-384
  not_product_score: 0.65      # คะแนนแกลเลอรีต่ำกว่านี้ = ไม่ใช่สินค้า (Modutech ต่ำสุด 0.719)
  not_product_text: -0.02      # ใกล้ข้อความ "ของอื่น" มากกว่า "สายพาน/โซ่" เกินนี้ = ไม่ใช่สินค้า (ของจริงต่ำสุด −0.010 · ไม่ใช่สายพานสูงสุด −0.026)
  direct_score: 0.8254         # คะแนนแกลเลอรีถึงนี้ = ไป Modutech ไม่ต้องถาม (Movex สูงสุดฝั่ง cal 0.8204 + 0.005)
